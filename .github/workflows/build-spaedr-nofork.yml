name: Build SPAEDR APK (no fork)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Download V2rayNG source (no fork needed)
        working-directory: .
        run: |
          git clone --recursive --depth 1 https://github.com/2dust/v2rayNG.git src

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build native tunnel (hev-socks5-tunnel)
        run: |
          export NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK_HOME=$NDK_HOME"
          bash compile-hevtun.sh

      - name: Build core (libv2ray.aar) from AndroidLibXrayLite
        run: |
          export NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          export ANDROID_NDK_HOME="$NDK_HOME"
          cd AndroidLibXrayLite
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          go mod tidy
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid=' -o libv2ray.aar ./
          mkdir -p ../V2rayNG/app/libs
          cp libv2ray.aar ../V2rayNG/app/libs/

      - name: Rebrand app name and id
        run: |
          # app name shown on the phone
          for f in $(grep -rl 'name="app_name"' V2rayNG/app/src/main/res --include=strings.xml); do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">ꜱᴘᴀᴇᴅʀ ɪʀ</string>|' "$f"
          done
          # application id (keeps the code package unchanged so the tunnel keeps working)
          sed -i 's|applicationId = "com.v2ray.ang"|applicationId = "ir.spaedr.app"|' V2rayNG/app/build.gradle.kts
          grep -n 'applicationId' V2rayNG/app/build.gradle.kts || true

      - name: Build APK (debug-signed, installable)
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew assemblePlaystoreDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spaedr-apk
          path: src/V2rayNG/app/build/outputs/apk/**/*.apk
